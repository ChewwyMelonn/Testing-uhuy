<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Listening Quiz – Bacteria</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: radial-gradient(circle at top, #006d77, #003049);
    color: #ffffff;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.quiz-box {
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
}

.timer {
    text-align: right;
    font-size: 1.2em;
    font-weight: bold;
    color: #ffd166;
}

.question-number {
    font-size: 1.1em;
    margin-bottom: 15px;
}

.audio-btn {
    display: block;
    margin: 15px auto 25px;
    background: #83c5be;
    color: #003049;
    border: none;
    padding: 14px 30px;
    font-size: 1.1em;
    border-radius: 40px;
    cursor: pointer;
}

.audio-btn:hover {
    background: #b7e4c7;
}

.options label {
    display: block;
    background: rgba(255,255,255,0.18);
    padding: 14px 18px;
    margin-bottom: 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.3s;
}

.options label:hover {
    background: rgba(255,255,255,0.3);
}

.options input {
    margin-right: 10px;
}

button.next {
    background: #edf6f9;
    color: #003049;
    border: none;
    padding: 12px 30px;
    border-radius: 30px;
    font-size: 1em;
    cursor: pointer;
    margin-top: 10px;
}

.result {
    text-align: center;
    font-size: 1.4em;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>Listening Quiz</h1>
        <p>Bacteria – Biology Grade 10</p>
    </div>

    <div class="quiz-box" id="quizBox">
        <div class="timer" id="timer">Time: 45</div>
        <div class="question-number" id="qNumber"></div>

        <button class="audio-btn" onclick="playAudio()">🔊 Play Question Audio</button>

        <div class="options" id="options"></div>

        <button class="next" onclick="nextQuestion()">Next</button>
    </div>
</div>

<script>
const questions = [
{
q: "Which of the following is not a characteristic of bacteria?",
a: [
"Unicellular",
"Has membrane-bound organelles",
"Microscopic in size",
"Prokaryotic organisms"
],
c: 1
},
{
q: "What is the main function of peptidoglycan in bacterial cell walls?",
a: [
"Regulates protein synthesis",
"Stores food reserves",
"Maintains shape and protects cells",
"Produces energy"
],
c: 2
},
{
q: "The main difference between Gram-positive and Gram-negative bacteria lies in what?",
a: [
"Cell shape",
"Reproduction method",
"Thickness of the peptidoglycan layer",
"Type of ribosome"
],
c: 2
},
{
q: "Bacteria that have many flagella distributed over the entire body surface are called what?",
a: [
"Monotrichous",
"Lophotrichous",
"Amphitrichous",
"Peritrichous"
],
c: 3
},
{
q: "The process of transferring bacterial genetic material with the help of viruses is called what?",
a: [
"Transformation",
"Conjugation",
"Transduction",
"Fragmentation"
],
c: 2
},
{
q: "Which of the following is an example of a chemoautotrophic bacterium?",
a: [
"Rhodospirillum",
"Nitrobacter",
"Lactobacillus",
"Escherichia coli"
],
c: 1
},
{
q: "The bacteria involved in making yogurt are which bacteria?",
a: [
"Bacillus anthracis",
"Acetobacter aceti",
"Lactobacillus bulgaricus",
"Clostridium botulinum"
],
c: 2
},
{
q: "Which bacteria can produce the antibiotic streptomycin?",
a: [
"Streptococcus thermophilus",
"Streptomyces griseus",
"Corynebacterium diphtheriae",
"Salmonella typhi"
],
c: 1
},
{
q: "The bacteria used as a bioinsecticide to kill plant pests are called what?",
a: [
"Bacillus thuringiensis",
"Vibrio cholerae",
"Neisseria gonorrhoeae",
"Mycobacterium tuberculosis"
],
c: 0
},
{
q: "The bacteria involved in producing biogas from organic waste are which bacteria?",
a: [
"Nitrosomonas",
"Methanobacterium",
"Rhizobium",
"Pseudomonas"
],
c: 1
}
];

let index = 0;
let score = 0;
let time = 45;
let timer;

function playAudio() {
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(questions[index].q);
    utter.lang = "en-US";
    utter.rate = 0.9;
    speechSynthesis.speak(utter);
}

function loadQuestion() {
    clearInterval(timer);
    time = 45;
    document.getElementById("timer").innerText = "Time: " + time;
    document.getElementById("qNumber").innerText =
        `Question ${index + 1} of ${questions.length}`;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    questions[index].a.forEach((opt, i) => {
        optionsDiv.innerHTML += `
        <label>
            <input type="radio" name="option" value="${i}">
            ${opt}
        </label>`;
    });

    playAudio();

    timer = setInterval(() => {
        time--;
        document.getElementById("timer").innerText = "Time: " + time;
        if (time === 0) nextQuestion();
    }, 1000);
}

function nextQuestion() {
    clearInterval(timer);
    const selected = document.querySelector('input[name="option"]:checked');
    if (selected && parseInt(selected.value) === questions[index].c) {
        score++;
    }
    index++;

    if (index < questions.length) {
        loadQuestion();
    } else {
        document.getElementById("quizBox").innerHTML = `
        <div class="result">
            <h2>Quiz Completed</h2>
            <p>Your Score: ${score} / ${questions.length}</p>
            <p>Accuracy: ${(score / questions.length * 100).toFixed(1)}%</p>
        </div>`;
    }
}

loadQuestion();
</script>

</body>
</html>
